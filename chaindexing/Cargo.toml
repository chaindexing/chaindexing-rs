[package]
name = "chaindexing"
version = "0.1.81"
authors = ["Chaindexing Contributors <chaindexing@gmail.com>"]
description = "Index any EVM chain and query in SQL"
keywords = ["blockchain", "crypto", "ethereum", "evm", "web3"]
categories = [
    "encoding",
    "cryptography::cryptocurrencies",
    "asynchronous",
    "concurrency",
]
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/chaindexing/chaindexing-rs"

[features]
default = ["postgres", "postgres-rustls"]
postgres = ["tokio-postgres"]
postgres-rustls = [
    "postgres",
    "rustls",
    "rustls-native-certs",
    "rustls-pemfile",
    "tokio-postgres-rustls",
]

[dependencies]
alloy = { version = "2.0.5", default-features = false, features = [
    "std",
    "provider-http",
    "rpc-types",
    "dyn-abi",
    "json-abi",
    "json",
    "reqwest",
    "reqwest-rustls-tls",
] }
alloy-chains = "0.2.34"
async-trait = "0.1"
bb8 = "0.9"
derive_more = { version = "2", features = ["display"] }
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", features = [
    "postgres",
    "uuid",
    "chrono",
    "serde_json",
] }
diesel-async = { version = "0.9", features = ["bb8", "postgres"] }
pin-project-lite = "0.2.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio-postgres = { version = "0.7", features = [
    "with-serde_json-1",
], optional = true }
tokio-postgres-rustls = { version = "0.14", features = ["ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures-core = { version = "0.3", features = ["alloc"] }
futures-util = "0.3"
sqlparser = "0.62"
chaindexing-macros = { path = "../chaindexing-macros", version = "0.1.80" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
