[package]
name = "chaindexing-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
chaindexing = { path = "../chaindexing", features = ["postgres"] }
alloy = { version = "2.0.5", default-features = false, features = [
    "std",
    "rpc-types",
] }
futures-util = "0.3"
dotenvy = "0.15"
diesel = { version = "2.3", features = ["postgres", "chrono"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = ["full"] }
